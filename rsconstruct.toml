# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
src_dirs = ["tera.templates"]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

[processor.ruff]
src_dirs = ["src", "config", "tests"]

[processor.pylint]
src_dirs = ["src", "config", "tests"]

[processor.mypy]
src_dirs = ["src", "config", "tests"]

[processor.requirements]
src_dirs = ["src", "config", "tests"]

[processor.pytest]
src_dirs = ["tests"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# Runtime deps so CI installs what the code imports (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern.
[dependencies]
pip = [
    "beautifulsoup4",
    "types-beautifulsoup4",
    "html5lib",
    "jsonschema",
    "lxml",
    "pylogconf",
    "pytconf",
    "referencing",
    "requests",
    "types-requests",
    "ruamel.yaml",
    "tqdm",
    "types-tqdm",
    "pyyaml",
    "types-PyYAML",
    "types-jsonschema",
    "lxml-stubs",
]
